services:

  # ── Caddy Reverse Proxy (Automated Let's Encrypt SSL) ──────────────
  caddy:
    image: caddy:2-alpine
    container_name: caddy-ssl
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # ── FastAPI Backend ────────────────────────────────────────────────
  app:
    build: .
    image: islamic-chatbot:latest
    container_name: islamic-chatbot-api
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - app_logs:/app/logs
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Qdrant Vector Database ─────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    expose:
      - "6333"
      - "6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── Redis Stack (Cache, Rate Limiting & RediSearch) ────────────────
  redis:
    image: redis/redis-stack-server:latest
    container_name: redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - ./redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── LangGraph Dev Server (LangSmith Studio live graph visualization) ──────
  # Reuses the same Dockerfile as the main app (langgraph-cli[inmem] is already
  # installed via requirements.txt). Overrides CMD to run `langgraph dev` which
  # exposes the graph over HTTP on port 8123 for LangSmith Studio to connect to.
  langgraph-api:
    image: islamic-chatbot:latest
    container_name: langgraph-api
    restart: unless-stopped
    command: >
      langgraph dev
      --host 0.0.0.0
      --port 8123
    ports:
      - "8123:8123"
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - app_logs:/app/logs
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
  app_logs:
